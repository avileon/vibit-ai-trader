# VIBIT AI Trader — dev + production.  cp .env.example .env && docker compose up -d --build
name: vibit-trader

x-api-env: &api-env
  NODE_ENV: production
  DATABASE_URL: mysql://vibit:${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}@mysql:3306/vibit
  TRADING_MODE: ${TRADING_MODE:-paper}
  ALPACA_BASE_URL: ${ALPACA_BASE_URL:-https://paper-api.alpaca.markets}
  MASTER_KEY: ${MASTER_KEY:?set MASTER_KEY in .env (openssl rand -base64 32)}
  CAPITAL_BASE_USD: ${CAPITAL_BASE_USD:-1000}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: vibit
      MYSQL_USER: vibit
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=+00:00"]
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20
    # not published to the host — only api/worker reach it on the internal network

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    image: vibit-trader-api
    restart: unless-stopped
    environment: *api-env
    depends_on: { mysql: { condition: service_healthy } }

  worker:
    image: vibit-trader-api
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    environment: *api-env
    depends_on:
      mysql: { condition: service_healthy }
      api: { condition: service_healthy }   # api runs migrations first
    healthcheck: { disable: true }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args: { API_INTERNAL_URL: http://api:4000 }
    restart: unless-stopped
    depends_on: { api: { condition: service_healthy } }
    ports: ["${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000"]

volumes:
  mysql_data:
